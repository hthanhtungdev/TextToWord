<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Word</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Google Fonts - Nhiều font đẹp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Phosphor Icons - Bộ icon nghệ thuật -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>

    <!-- AOS - Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Decorative blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="app">
        <header data-aos="fade-down" data-aos-duration="600">
            <div class="logo">
                <div class="logo-icon">
                    <i class="ph-bold ph-file-doc"></i>
                </div>
                <div>
                    <h1>Text to Word</h1>
                    <p class="tagline">Biến văn bản thành tài liệu chuyên nghiệp</p>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <div class="panel input-panel" data-aos="fade-right" data-aos-duration="600" data-aos-delay="100">
                <div class="field">
                    <label for="file-name">
                        <i class="ph ph-tag"></i> Tên file
                    </label>
                    <input type="text" id="file-name" placeholder="Ví dụ: bai-tap-quan-tri-rui-ro">
                </div>

                <div class="field textarea-field">
                    <label for="doc-content">
                        <i class="ph ph-text-aa"></i> Nhập văn bản
                    </label>
                    <textarea id="doc-content" placeholder="Dán hoặc nhập nội dung văn bản vào đây..."></textarea>
                </div>

                <button id="format-btn" class="format-btn" disabled>
                    <i class="ph-bold ph-magic-wand btn-icon"></i>
                    <div class="spinner hidden"></div>
                    <span class="btn-text">AI Sắp xếp thông minh</span>
                </button>
            </div>

            <div class="panel action-panel" data-aos="fade-left" data-aos-duration="600" data-aos-delay="200">
                <div class="action-content">
                    <div class="icon-box">
                        <i class="ph-duotone ph-file-doc"></i>
                    </div>

                    <button id="download-btn" class="download-btn" disabled>
                        <i class="ph-bold ph-download-simple"></i>
                        <span class="btn-text">Tải file Word (.doc)</span>
                    </button>

                    <button id="copy-btn" class="copy-btn" disabled>
                        <i class="ph-bold ph-share-network"></i>
                        <span class="btn-text">Chia sẻ file Word</span>
                    </button>

                    <p class="action-desc" id="action-hint">
                        <i class="ph ph-info"></i> Nhập nội dung để bắt đầu
                    </p>
                </div>
            </div>
        </div>

        <footer data-aos="fade-up" data-aos-duration="600" data-aos-delay="300">
            <p class="credit">Created by Tung Huynh</p>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden">
        <i class="ph-bold ph-check-circle"></i>
        <span id="toast-text">Thành công!</span>
    </div>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="app.js"></script>
</body>
</html>
